name: JavaScript Test Validation Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # required for GHCR

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      #  Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      #  Debug structure (optional)
      - name: Show repo structure
        run: |
          ls
          ls backend
          ls frontend

      #  Install backend dependencies
      - name: Install backend dependencies
        run: |
          cd backend
          for i in 1 2 3; do
            npm ci && break || sleep 10
          done

      #  Setup Jest
      - name: Setup Jest
        run: |
          cd backend
          npm install --save-dev jest || true
          npm pkg set scripts.test="jest"

      #  Run backend tests
      - name: Run backend tests
        run: |
          cd backend
          NODE_ENV=test npm test

      #  Login to GitHub Container Registry
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      #  Build backend Docker image
      - name: Build backend Docker image
        run: |
          cd backend
          docker build -t ghcr.io/${{ github.repository_owner }}/connectblood-backend:latest .

      #  Push backend Docker image
      - name: Push backend Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/connectblood-backend:latest

      #  Install frontend dependencies
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci || npm install

      #  Build frontend
      - name: Build frontend
        run: |
          cd frontend
          npm run build

      #  Build frontend Docker image
      - name: Build frontend Docker image
        run: |
          cd frontend
          docker build -t ghcr.io/${{ github.repository_owner }}/connectblood-frontend:latest .

      #  Push frontend Docker image
      - name: Push frontend Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/connectblood-frontend:latest
